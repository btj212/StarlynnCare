id: PA-04-smoke-emergency
source_case: PA-04
language: pa
situation: "Smoke from the engine; driver coughing."
mock:
  kind: hazard_smoke
  caller_text: "ਇੰਜਣ ਤੋਂ ਧੂੰਆਂ ਆ ਰਿਹਾ ਹੈ ਅਤੇ ਮੈਨੂੰ ਖੰਘ ਆ ਰਹੀ ਹੈ।"
expect:
