# Weekly full-source inspection check for every live state except California.
#
# California resumes on the Mac (launchd com.starlynncare.ca-watch, 6:15 local).
# A GitHub California job held this one-at-a-time queue for six hours and was
# then cancelled, which pushed every later state to the back of the day.
#
# States run one at a time. Pennsylvania and Washington are last because they
# take the longest. Requires secrets: DATABASE_URL, ANTHROPIC_API_KEY.
name: Weekly state source scan

# Family mail goes out only from the Sunday schedule, and only after the data
# check passes. A merge does not start a scan. A hand-started run sends mail
# only when its alert box is checked. Pushing the ingest script used to start
# the full scan and could email families on a weeknight.
on:
  schedule:
    # Sundays 08:00 UTC (midnight Pacific during standard time)
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      state:
        description: "Single state code (optional, e.g. OR). Leave blank for all. California is not in this workflow."
        required: false
        type: string
      dispatch_alerts:
        description: "On a manual run, also send facility and area watch emails"
        required: false
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Supabase session pooler is pool_size=15; even 3 parallel jobs exhaust it when
      # each state opens multiple connections (MN/IL/PA/UT failed 2026-06-25 run 28137781944).
      max-parallel: 1
      matrix:
        state: [MN, OR, IL, UT, TX, AZ, MO, PA, WA]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          pip install -r scrapers/requirements.txt

      - name: Run weekly inspection ingest (${{ matrix.state }})
        id: ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "${{ inputs.state }}" ] && [ "${{ inputs.state }}" != "${{ matrix.state }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.state }} (workflow_dispatch targeted ${{ inputs.state }})"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          python3 scripts/weekly_inspection_ingest.py --state "${{ matrix.state }}" --skip-validate --scan-run-output /tmp/state-watch-run-id

      - name: Layer 5 post-ingest — ${{ matrix.state }}
        id: layer5
        if: always() && steps.ingest.outcome != 'cancelled' && steps.ingest.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scripts/validate/post_ingest_check.py --state ${{ matrix.state }}

      - name: Export State Watch scan report — ${{ matrix.state }}
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -s /tmp/state-watch-run-id ]; then
            python3 scripts/export_state_scan_report.py \
              --scan-run-id "$(tr -d '\n' < /tmp/state-watch-run-id)" \
              --output "state-scan-${{ matrix.state }}.json" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload State Watch scan report — ${{ matrix.state }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-scan-${{ matrix.state }}-${{ github.run_id }}
          path: state-scan-${{ matrix.state }}.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Dispatch area and facility watch alerts — ${{ matrix.state }}
        if: steps.ingest.outcome == 'success' && steps.ingest.outputs.skip != 'true' && steps.layer5.outcome == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dispatch_alerts))
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOOPS_API_KEY: ${{ secrets.LOOPS_API_KEY }}
          LOOPS_AREA_WATCH_CHANGE_ID: ${{ secrets.LOOPS_AREA_WATCH_CHANGE_ID }}
          LOOPS_WATCH_CHANGE_ID: ${{ secrets.LOOPS_WATCH_CHANGE_ID }}
          NEXT_PUBLIC_SITE_URL: https://www.starlynncare.com
        run: python3 scripts/dispatch_watch_alerts.py --scan-run-id "$(tr -d '\n' < /tmp/state-watch-run-id)"

      - name: Dispatch facility watch notes after a partial scan — ${{ matrix.state }}
        if: steps.ingest.outcome == 'failure' && steps.ingest.outputs.skip != 'true' && steps.layer5.outcome == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dispatch_alerts))
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOOPS_API_KEY: ${{ secrets.LOOPS_API_KEY }}
          LOOPS_AREA_WATCH_CHANGE_ID: ${{ secrets.LOOPS_AREA_WATCH_CHANGE_ID }}
          LOOPS_WATCH_CHANGE_ID: ${{ secrets.LOOPS_WATCH_CHANGE_ID }}
          NEXT_PUBLIC_SITE_URL: https://www.starlynncare.com
        run: |
          if [ -s /tmp/state-watch-run-id ]; then
            python3 scripts/dispatch_watch_alerts.py --scan-run-id "$(tr -d '\n' < /tmp/state-watch-run-id)"
          else
            echo "No scan id was written. No facility watch notes were sent."
          fi

      - name: Email the operator a scan report — ${{ matrix.state }}
        if: always() && steps.ingest.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOOPS_API_KEY: ${{ secrets.LOOPS_API_KEY }}
          LOOPS_ADMIN_ALERT_ID: ${{ secrets.LOOPS_ADMIN_ALERT_ID }}
          ADMIN_ALERT_EMAIL: ${{ secrets.ADMIN_ALERT_EMAIL }}
        run: |
          if [ -s /tmp/state-watch-run-id ]; then
            python3 scripts/report_scan_run.py \
              --scan-run-id "$(tr -d '\n' < /tmp/state-watch-run-id)" \
              --data-check "${{ steps.layer5.outcome }}" \
              --admin-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            python3 scripts/report_scan_run.py \
              --state "${{ matrix.state }}" \
              --missing \
              --data-check "${{ steps.layer5.outcome }}" \
              --admin-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

  validate:
    needs: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Layer 5b — hub content drift audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scripts/validate/hub_content_drift_check.py

      - name: Layer 3 — production smoke
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scripts/validate/smoke_test.py --env production || true
